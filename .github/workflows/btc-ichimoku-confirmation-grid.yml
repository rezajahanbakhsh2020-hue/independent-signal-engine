name: BTC Ichimoku Confirmation Grid

on:
  workflow_dispatch:
  push:
    branches:
      - opencode/issue1-20261029151352
    paths:
      - "scripts/backtest_btc_ichimoku_confirmation_grid.py"
      - ".github/workflows/btc-ichimoku-confirmation-grid.yml"
      - "signal_engine/backtest.py"
      - "signal_engine/strategies/base.py"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine
        run: python -m pip install -e .
      - name: Run one-year BTC-only Ichimoku confirmation grid
        run: python scripts/backtest_btc_ichimoku_confirmation_grid.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: btc-ichimoku-confirmation-grid
          path: artifacts/btc_ichimoku_confirmation_grid.*
          retention-days: 14
