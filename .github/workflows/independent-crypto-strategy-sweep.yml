name: Independent Crypto Strategy Sweep
on:
  push:
    branches: [research/crypto-strategy-sweep-20261030]
    paths:
      - scripts/independent_crypto_strategy_sweep.py
      - .github/workflows/independent-crypto-strategy-sweep.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/independent_crypto_strategy_sweep.py
      - .github/workflows/independent-crypto-strategy-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run two-month strategy sweep
        run: python scripts/independent_crypto_strategy_sweep.py
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: independent-crypto-strategy-sweep
          path: artifacts/crypto_strategy_sweep/
          if-no-files-found: error
          retention-days: 30
