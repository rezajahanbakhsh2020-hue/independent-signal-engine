name: Independent Signal Engine Builder

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: independent-signal-engine-opencode
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate trigger command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "${COMMENT_AUTHOR,,}" != "${REPOSITORY_OWNER,,}" ]]; then
            echo "::error::Only the repository owner may trigger this workflow."
            exit 1
          fi

          if ! printf '%s\n' "$COMMENT_BODY" |
            grep -Eq '(^|[[:space:]])/opencode([[:space:]]|$)'; then
            echo "::error::Use /opencode as a standalone command."
            exit 1
          fi

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify required resume branch
        shell: bash
        env:
          CHECKPOINT: cc1dab38d9d725e8635f7e1fca3478fcbc509d94
          RESUME_BRANCH: opencode/issue1-20261029091040
        run: |
          set -euo pipefail

          git cat-file -e "${CHECKPOINT}^{commit}" || {
            echo "::error::Required checkpoint is missing."
            exit 1
          }

          git merge-base --is-ancestor "$CHECKPOINT" HEAD || {
            echo "::error::Checkpoint is not an ancestor of main."
            exit 1
          }

          git ls-remote --exit-code --heads origin \
            "refs/heads/$RESUME_BRANCH" >/dev/null || {
              echo "::error::Required resume branch is missing. Refusing to restart from main."
              exit 1
            }

          git fetch --no-tags origin \
            "+refs/heads/${RESUME_BRANCH}:refs/remotes/origin/${RESUME_BRANCH}"

          RESUME_SHA="$(git rev-parse "refs/remotes/origin/${RESUME_BRANCH}")"

          git merge-base --is-ancestor "$CHECKPOINT" "$RESUME_SHA" || {
            echo "::error::Resume branch does not contain the checkpoint."
            exit 1
          }

          echo "Checkpoint: $CHECKPOINT"
          echo "Resume branch: $RESUME_BRANCH"
          echo "Resume HEAD: $RESUME_SHA"
          echo "Resume commits:"
          git log --oneline -20 "$RESUME_SHA"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            Work on issue #${{ github.event.issue.number }}.
            Do not edit the issue text or comments.
            Work only in this repository.

            REQUIRED CHECKPOINT:
            cc1dab38d9d725e8635f7e1fca3478fcbc509d94

            REQUIRED EXISTING BRANCH:
            opencode/issue1-20261029091040

            Inspect the verified resume branch and its commits against main.
            Preserve useful existing work and continue implementation.
            Do not silently restart from main, discard prior work, or
            create a duplicate PR. If the action cannot safely reuse
            existing work, report the exact blocker.

            Never reset, force-push, rewrite history, commit directly to
            main, or merge automatically. Do not modify Issue #1.

            Build the independent Python 3.11+ signal engine for
            XAUUSD, BTCUSDT, and ETHUSDT across:
            1m, 5m, 15m, 30m, 1H, 4H, 1D.

            Preserve modular data validation, strategies, risk controls,
            deterministic backtesting, walk-forward evaluation, untouched
            holdout, randomized statistical baseline, and reproducible
            reporting. Prevent lookahead, leakage, fabricated market
            data, and impossible fills. Support BUY, SELL, and NO TRADE.
            Never promise profitability.

            Preserve existing tests. Run targeted tests and the full
            relevant test suite. Review all changes for regressions,
            secrets, accidental deletions, and unrelated files.

            Do not invent test results or claim a push or PR unless
            remote state confirms it. Report exact commit, branch,
            changed files, commands and results, evaluated combinations,
            evidence level, blockers, and status:
            COMPLETE, COMPLETE_OFFLINE, PARTIAL, or BLOCKED.
