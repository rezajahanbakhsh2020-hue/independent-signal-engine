name: Independent Signal Engine — Phase 0 Data Audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: independent-signal-engine-phase0-audit
  cancel-in-progress: false

jobs:
  phase0-audit:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate owner-only Phase 0 trigger
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "${COMMENT_AUTHOR,,}" == "${REPOSITORY_OWNER,,}" ]]
          printf '%s\n' "$COMMENT_BODY" | grep -Eq '(^|[[:space:]])/opencode([[:space:]]|$)'

      - name: Checkout current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded Phase 0 audit with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            Perform ONLY Phase 0 read-only historical data audit for this repository.
            The repository owner explicitly authorized this task by posting /opencode
            on issue #1. Work from the checked-out current main commit.

            TARGETS:
            1) BTCUSDT Spot, Binance, 1h.
            2) XAUUSD, BiQuote, 1h, using the existing adapter
               signal_engine/data/biquote_source.py.

            HARD SAFETY AND SCOPE:
            - This is a READ-ONLY audit. Do not modify tracked files.
            - Do not create files in the repository, commits, branches, or pull requests.
            - Temporary scripts/data may be written only under /tmp and must be removed.
            - Do not run strategy backtests, parameter optimization, market scans, or trades.
            - Do not change the backtester, walkforward, metrics, risk, strategies, dashboard,
              perpetual adapters, dependencies, or any application configuration.
            - Do not access or modify P1 or P2.
            - Do not use API keys or credentials.
            - Do not fabricate data, costs, market calendars, or coverage.
            - Respect provider rate limits; sequential pagination, bounded request pacing,
              retry only transient errors with a small bounded retry count.
            - Exclude unfinished candles and retain UTC timestamps.
            - Do not use the stale OpenCode resume branch or any hard-coded checkpoint.

            DATA RETRIEVAL:
            Inspect the existing Binance and BiQuote adapters and reuse their validation,
            pagination, symbol mapping, and closed-candle semantics wherever practical.
            Retrieve complete available BTCUSDT 1h Spot history with page size <= 1000.
            Retrieve available XAUUSD 1h history through the existing BiQuote adapter,
            respecting MAX_LIMIT=1000 and MAX_ELAPSED_SECONDS=90.
            Do not stitch providers or exchanges.

            AUDIT OUTPUT FOR EACH MARKET:
            - first and last valid CLOSED candle (UTC)
            - total valid candles
            - duplicate timestamps
            - missing expected intervals and largest gap
            - total missing intervals
            - coverage fraction only when a valid expected-market calendar is known
            - pagination completion/truncation and provider errors
            - exact request count and elapsed time
            - data-quality caveats

            WALK-FORWARD FEASIBILITY:
            Evaluate 6 calendar months train / 2 calendar months OOS / 2 calendar months
            between OOS starts, plus a final chronological 20% holdout.
            Use actual UTC calendar boundaries and observed timestamps, never fixed
            month-to-candle conversions. Report exact usable windows and their boundaries.
            Training data must precede each fold's OOS interval. Do not mislabel ordinary
            rolling-window reuse as leakage. Do not invent purge horizons; report that
            purge requirements depend on actual label/maximum holding horizon if not known.
            This is feasibility only; do not run strategy backtests.

            REPORT:
            Post a concise evidence-rich report as a comment on issue #1, including:
            repository HEAD inspected; separate BTC and XAU audit tables; WF window counts;
            provider request counts and elapsed times; limitations; and one decision:
            BTCUSDT SUITABLE / XAUUSD SUITABLE / BOTH / NEITHER / INSUFFICIENT EVIDENCE.
            Explain the evidence for the decision.
            Explicitly confirm that no tracked files, branches, commits, or PRs were changed.
            If a provider cannot be reached or complete history cannot be retrieved, report
            the blocker honestly and stop; do not silently substitute another data source.
