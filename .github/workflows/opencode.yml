name: Independent Signal Engine — Phase 0 Data Audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: independent-signal-engine-phase0-audit
  cancel-in-progress: true

jobs:
  phase0-audit:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate owner-only Phase 0 trigger
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "${COMMENT_AUTHOR,,}" == "${REPOSITORY_OWNER,,}" ]]
          printf '%s\n' "$COMMENT_BODY" | grep -Eq '(^|[[:space:]])/opencode([[:space:]]|$)'

      - name: Checkout current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded Phase 0 audit with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            Complete this bounded, READ-ONLY data audit. Do not perform general
            repository review, coding, tests, strategy research, or optimization.

            Targets only:
            - BTCUSDT Spot 1H from Binance public Spot API.
            - XAUUSD 1H from the existing BiQuote adapter.

            Execute immediately; do not spend time exploring unrelated files.
            Inspect only the two named adapters and the minimum validation code
            needed to call them correctly. Use one temporary Python script under
            /tmp if useful. Install only the project's existing runtime dependencies
            if required. Do not create repository files.

            Hard execution budget:
            - Finish within 10 minutes; leave time to post the report.
            - Binance: page size <= 1000, at most 100 requests, sequential requests,
              0.25s minimum pacing, official Binance hosts only, never mix hosts.
            - BiQuote: use existing adapter, at most 10 pages and 80 seconds total;
              respect its 1000-bar page limit and exclude open candles.
            - End both ranges at the latest fully closed UTC 1H boundary.
            - Stop on provider/rate-limit/validation errors; no unbounded retries.
            - If a target cannot be completed within its budget, report PARTIAL or
              INSUFFICIENT EVIDENCE with the exact blocker. Never guess or fabricate.

            For each target report:
            first/last closed UTC candle, valid candle count, duplicate timestamps,
            missing 1H intervals and largest gap, exact request count and elapsed
            time where observable, pagination truncation, provider errors, and
            source-specific caveats. Do not claim calendar coverage for XAUUSD
            without a verified market calendar. For BTCUSDT, treat Spot as 24/7
            only over the provider's actual listing/history interval.

            Walk-forward feasibility only: derive chronological UTC calendar
            windows from observed timestamps for 6-month train / 2-month OOS /
            2-month OOS-start spacing and a final chronological 20% holdout.
            Report counts and exact boundaries. Do not run backtests. Do not invent
            purge/embargo horizons; state that these require the actual label or
            maximum holding horizon.

            Post one concise evidence-based comment to issue #1. Include inspected
            main SHA, separate BTC/XAU results, feasibility, limitations, and one
            decision: BTCUSDT SUITABLE / XAUUSD SUITABLE / BOTH / NEITHER /
            INSUFFICIENT EVIDENCE. Confirm no tracked files, branches, commits,
            PRs, P1, or P2 were changed. If the 10-minute budget is reached,
            stop and post the partial evidence instead of continuing.
