
name: Independent Signal Engine Builder

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: independent-signal-engine-opencode
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resume existing implementation
        shell: bash
        env:
          BRANCH: opencode/issue1-20261029091040
          CHECKPOINT: cc1dab38d9d725e8635f7e1fca3478fcbc509d94
        run: |
          set -euo pipefail

          git fetch --no-tags origin

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin \
              "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -B "${BRANCH}" "refs/remotes/origin/${BRANCH}"
          else
            echo "Remote resume branch is absent; verifying checkpoint."

            if ! git fetch origin "${CHECKPOINT}"; then
              echo "::error::Cannot fetch the required checkpoint."
              exit 1
            fi

            if ! git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null; then
              echo "::error::Required checkpoint is not available."
              exit 1
            fi

            git checkout -b "${BRANCH}" "${CHECKPOINT}"
            git push --set-upstream origin "${BRANCH}"
          fi

          if ! git cat-file -e "${CHECKPOINT}^{commit}" 2>/dev/null; then
            echo "::error::Required checkpoint is missing from fetched history."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${CHECKPOINT}" HEAD; then
            echo "::error::Resume branch does not contain the required checkpoint."
            echo "No automatic reset or history rewrite will be attempted."
            exit 1
          fi

          echo "===== RESUME VERIFICATION ====="
          echo "Branch: $(git branch --show-current)"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Checkpoint: ${CHECKPOINT}"
          echo "Checkpoint ancestry: verified"
          git status --short
          echo "===== END VERIFICATION ====="

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            You are the autonomous implementation engineer for this repository.

            OBJECTIVE
            Continue and verify the existing Independent Multi-Market Signal
            Engine implementation. Preserve valid prior work, fix concrete
            remaining defects, run tests, and deliver an evidence-based report.
            Do not stop after creating a plan.

            REPOSITORY BOUNDARY
            Work only in the current repository.
            Do not access, clone, inspect, modify, or integrate with
            AI-Trading-Lab, AI-Trading-Lab-Platform, or any other repository.
            Never reveal, print, or commit secrets.

            MANDATORY RESUME
            Required branch:
            opencode/issue1-20261029091040

            Required checkpoint:
            cc1dab38d9d725e8635f7e1fca3478fcbc509d94

            Before editing, verify the actual branch, HEAD, Git status,
            existing diff, and checkpoint ancestry. Preserve valid work.
            Never reset, force-push, rewrite history, or rebuild from scratch.
            If the checkpoint or branch state is invalid, stop modifications
            and report the exact blocker.

            PROJECT SCOPE
            Build a standalone Python 3.11+ signal research and evaluation
            engine for:
            - XAUUSD
            - BTCUSDT
            - ETHUSDT

            Canonical timeframes:
            1m, 5m, 15m, 30m, 1H, 4H, 1D

            The full matrix contains 21 independent market/timeframe
            combinations. Never claim a combination was evaluated without
            actual supporting evidence.

            1. ARCHITECTURE
            Maintain a modular, deterministic, testable Python project.
            Separate data acquisition, validation, strategies, risk,
            backtesting, statistical evaluation, and reporting.
            Preserve useful existing architecture and keep dependencies
            minimal.

            2. STRATEGIES
            Implement and test configurable:
            - SMA/EMA crossover
            - Trend pullback
            - Price breakout
            - Bollinger-band mean reversion

            Define signal timing and execution assumptions explicitly.
            Prevent lookahead bias. Never assume execution at a price that
            was unavailable at decision time.

            3. DATA INTEGRITY
            Support user-provided CSV as the primary offline path, including
            XAUUSD. Where practical, support public credential-free BTCUSDT
            and ETHUSDT data.

            Validate OHLCV schema, numeric values, NaN, infinity, duplicate
            and unsorted timestamps, invalid OHLC relationships, negative
            volume, malformed records, and gaps.

            Normalize timestamps to UTC. Record source, retrieval time,
            timezone, symbol mapping, coverage, and rejected records.
            Never fabricate candles, silently fill missing prices, or use
            synthetic data as a market-data fallback. Identify synthetic
            fixtures as test/demo-only.

            4. SIGNALS AND RISK
            Support BUY, SELL, and NO TRADE.
            Implement ATR-based stop geometry, configurable risk/reward,
            and position sizing.

            Validate entry, stop, target, direction, invalidation, and finite
            numeric values. Handle zero ATR, insufficient warm-up, and
            invalid prices explicitly. Never force a trade or claim
            guaranteed profitability.

            5. BACKTESTING
            Use deterministic chronological execution.
            Model fees, spread, slippage, fill assumptions, and candle
            execution ordering. Prevent lookahead, overlapping-trade, and
            accounting errors.

            Report equity, realized/unrealized P&L, drawdown, exposure,
            trade count, turnover, and relevant risk metrics. Distinguish
            gross from net results. Handle empty trades, zero denominators,
            negative equity, and insufficient samples.
            Never describe simulated performance as live performance.

            6. WALK-FORWARD AND HOLDOUT
            Separate training, validation, out-of-sample, and untouched
            holdout periods chronologically. Do not tune on the final holdout.
            Record exact UTC boundaries and sample counts. Detect temporal
            overlap and leakage. Fail closed when required evidence is
            absent or invalid.

            7. STATISTICAL EVALUATION
            Include a documented randomized baseline with a fixed seed and
            explicit null hypothesis.

            When applicable, calculate the empirical one-sided p-value:
            (1 + count(random_stat >= observed_stat)) / (M + 1)

            Document the statistic, simulation count, null model, and
            limitations. Do not claim significance without valid samples.
            Address multiple testing and strategy-selection bias where
            feasible.

            8. CONCENTRATION AND METRICS
            Calculate concentration using traceable net P&L or explicitly
            defined returns. State the denominator and treatment of losses.
            Handle zero or negative denominators without misleading
            percentages. Preserve the values needed to reproduce metrics.

            9. TESTS AND QUALITY
            Preserve the existing test suite.
            Cover strategy families, timeframe and market identifiers,
            invalid inputs, boundary cases, lookahead, timestamp alignment,
            costs, stop geometry, holdout leakage, and metric edge cases.

            Use deterministic fixtures and fixed random seeds.
            Run targeted tests and then the full relevant suite.
            Run configured lint/type checks where available.
            Fix failures caused by changes. Never weaken or delete tests
            to obtain a passing result. Report only commands that actually
            ran and their actual results.

            10. CLI AND DOCUMENTATION
            Ensure documented commands match the real implementation for
            installation, tests, CSV validation, backtesting, walk-forward
            evaluation, statistical baseline, single-combination reports,
            and the full 21-combination matrix.

            Document schemas, assumptions, limitations, and completion
            statuses.

            11. EXECUTION DISCIPLINE
            Inspect Git state and existing code before editing.
            Identify concrete gaps, implement the smallest coherent fixes,
            test each stage, inspect failures, and review the final diff for
            accidental deletions, unrelated files, secrets, and generated
            artifacts.

            Limit attempts to three per failing stage. Do not loop
            indefinitely or repeatedly rewrite working components.

            12. GIT AND PR SAFETY
            Stay on the existing resume branch.
            Never commit directly to the default branch, force-push,
            bypass branch protection, bypass required reviews, or bypass
            failing checks.

            Inspect existing PRs and update the relevant PR if one exists.
            Do not create duplicate PRs. Do not merge automatically.
            The repository owner decides whether to merge.

            Push or create/update a PR only when permissions permit.
            Never claim an operation succeeded without GitHub confirmation.
            If a permission error occurs, report the exact error and
            preserve safe work.

            13. EVIDENCE LEVELS
            LEVEL 1: implementation and tests.
            LEVEL 2: evaluation on actual supplied or acquired market data.
            LEVEL 3: live signal verification using genuine current market
            data.

            Use exactly one completion status:
            COMPLETE
            COMPLETE_OFFLINE
            PARTIAL
            BLOCKED

            A valid NO TRADE is acceptable. Missing data must remain
            explicitly missing. Never fabricate evidence or claim a higher
            evidence level than was verified.

            14. FINAL REPORT
            Report the confirmed branch and commit SHA, changed files,
            implemented fixes, exact test commands and results, lint/type
            check results when run, combinations actually evaluated, data
            sources and date ranges, computed statistical results, remaining
            blockers, completion status, and evidence level.

            Never fabricate test results, market data, commit SHAs, PR URLs,
            pushes, or completion claims. Execute the available work and
            report the verified outcome.
