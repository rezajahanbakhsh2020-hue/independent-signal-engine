name: Live Crypto Chart Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - opencode/issue1-20261029151352

permissions:
  contents: read

jobs:
  live-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine
        run: python -m pip install -e .
      - name: Fetch public SOLUSDT candles and render chart
        run: |
          mkdir -p charts
          set +e
          signal-engine chart-crypto \
            --market SOLUSDT \
            --timeframe 1H \
            --strategy crossover \
            --param fast=10 \
            --param slow=30 \
            --out charts/SOLUSDT_1H.html 2>&1 | tee charts/run-result.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          test -s charts/SOLUSDT_1H.html
          grep -q "SOLUSDT" charts/SOLUSDT_1H.html
      - name: Upload rendered chart and run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-solusdt-chart
          path: charts/
          if-no-files-found: warn
          retention-days: 7
